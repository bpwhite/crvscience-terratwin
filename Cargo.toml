[package]
name = "terratwin-climate-hub"
version = "2.5.0"
edition = "2021"
description = "TerraTwin HPC Climate Modeling & Telemetry Hub — Rust native headless daemon + desktop global map GUI with SQLite data management and multi-threaded Rayon climate physics simulation"
license = "MIT OR Apache-2.0"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[[bin]]
name = "terratwin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

# Native GUI dependencies (optional so pure headless server builds can pass --no-default-features)
eframe = { version = "=0.29.1", optional = true }
egui = { version = "=0.29.1", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
